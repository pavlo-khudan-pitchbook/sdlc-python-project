[project]
name = "test-cronjob"
version = "0.3.0"
description = "A Python cronjob that retrains the support ticket classifier on SageMaker. Every run exports the latest human-labelled tickets to S3, launches a SageMaker training job, and registers the resulting model in the model registry."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "alembic>=1.16.0",
    "boto3>=1.38.0",
    "prometheus-client>=0.22.1",
    "psycopg[binary,pool]>=3.2.9",
    "pydantic-settings>=2.10.1",
    "sqlalchemy>=2.0.41",
    "structlog>=25.4.0",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.14",
    "moto[s3,sagemaker]>=5.1.0",
    "mypy>=1.17.1",
    "pre-commit>=4.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock==3.14.1",
    "pytest>=8.4.1",
    "ruff==0.12.8",
    "uv-sort>=0.6.1",
]

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require docker-compose stack)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
addopts = "--cov=retraining_job --cov=application --cov=configuration --cov-branch -vv"

[tool.ruff]
preview = true
target-version = "py313"
line-length = 90
fix = true
output-format = "concise"
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
]
lint.ignore = [
    "B008",    # function-call-in-default-argument
    "BLE001",  # Do not catch blind exception
    "E501",    # Line too long
    "PLR0913", # Too many arguments in function definition
    "PLR0917", # Too many positional arguments
    "PLR2004", # Magic value used in comparison
    "PLR6301", # Method could be a function, class method, or static method
    "RET504",  # Unnecessary variable assignment before `return` statement
    "S101",    # Use of `assert` detected
    "S608",    # Possible SQL injection via string-based query construction
]
lint.select = [
    "A",    # flake8-builtins
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except
    "C4",   # flake8-comprehensions
    "E",    # pycodestyle
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "PL",   # Pylint
    "PTH",  # flake8-use-pathlib
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "RUF",  # Ruff-specific rules
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
    "UP",   # pyupgrade
    "W",    # pycodestyle
]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLC2701", "ARG001"]
"scripts/*" = ["T201"]

[tool.mypy]
explicit_package_bases = true
namespace_packages = true
check_untyped_defs = true
ignore_missing_imports = true
mypy_path = "src"
exclude = [
    "\\.git",
    "\\.venv",
    ".*\\.egg-info",
    "(src/)?tests",
    "scripts",
]
plugins = ["pydantic.mypy"]
