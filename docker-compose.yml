services:
  # =============================================================================
  # PostgreSQL Database (source of labelled tickets + model registry)
  # =============================================================================
  postgres:
    image: postgres:18-alpine
    hostname: postgres
    container_name: retraining-local-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: retraining_user
      POSTGRES_PASSWORD: retraining_password
      POSTGRES_DB: retraining
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retraining_user -d retraining"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

  # =============================================================================
  # Fake AWS (S3 + SageMaker) via moto
  # =============================================================================
  aws:
    image: motoserver/moto:5.1.4
    hostname: aws
    container_name: retraining-local-aws
    ports:
      - "4566:5000"
    environment:
      MOTO_PORT: 5000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # =============================================================================
  # Retraining Job (single run, same as one CronJob execution)
  # =============================================================================
  retraining-job:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retraining-local-job
    profiles: ["job"]
    depends_on:
      postgres:
        condition: service_healthy
      aws:
        condition: service_healthy
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: info
      LOG_FORMAT: console
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: retraining
      DB_USERNAME: retraining_user
      DB_PASSWORD: retraining_password
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://aws:5000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      TRAINING_DATA_S3_BUCKET: local-training-data
      MODEL_ARTIFACTS_S3_BUCKET: local-model-artifacts
      SAGEMAKER_ROLE_ARN: arn:aws:iam::123456789012:role/local-sagemaker-role
      TRAINING_IMAGE_URI: 123456789012.dkr.ecr.us-east-1.amazonaws.com/ticket-classifier-training:latest
      TRAINING_POLL_INTERVAL_S: 1
    volumes:
      # Ensure the container always uses the latest src, regardless of cached Docker images
      - ./src:/src:ro
    restart: "no"

volumes:
  postgres-data:
    driver: local
